<div id="systemStatusBox" style="padding: 10px; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 6px; margin-bottom: 15px;">
  <strong>Status do Sistema:</strong> 
  <span id="statusText" style="color: #10B981; font-weight: bold;">🟢 A verificar ligação à nuvem...</span>
</div>

<!-- Certifique-se de que os scripts do Firebase e o firebase-sync.js estão incluídos no <head> de configuracao.html -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="firebase-sync.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const statusText = document.getElementById('statusText');
    if (typeof db !== 'undefined') {
      statusText.innerHTML = "🟢 Conectado à Nuvem (Firebase Firestore Ativo)";
      statusText.style.color = "#10B981";
    } else {
      statusText.innerHTML = "🟡 Modo Local (Armazenamento Local Ativo)";
      statusText.style.color = "#F59E0B";
    }
  });
</script>
