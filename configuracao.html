<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laser Expert - Teste de Atualização</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">Laser Expert</a>
      <nav>
        <ul>
          <li><a href="index.html">Clientes</a></li>
          <li><a href="configuracao.html" class="active">Configuração</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <!-- TESTE VISUAL GIGANTE -->
    <div style="background: yellow; color: red; padding: 25px; border: 5px solid red; text-align: center; margin-bottom: 20px; font-size: 1.2rem; font-weight: bold;">
      ⚠️ TESTE DE ATUALIZAÇÃO DO GITHUB PAGES ⚠️️
      <br><br>
      <button type="button" id="btn-backup-teste" style="background: #2563EB; color: white; padding: 15px 25px; font-size: 1.1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">
        📥 BOTÃO DE BACKUP DE TESTE
      </button>
    </div>

    <section class="card">
      <h2>Configurações da Empresa</h2>
      <form id="configForm">
        <div class="form-group">
          <label for="configName">Razão Social:</label>
          <input type="text" id="configName" required>
        </div>
        <button type="submit" class="btn" style="background: var(--success); width: 100%; padding: 12px;">Salvar Dados</button>
      </form>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('configName').value = "LASER EXPERT TESTE";
      
      document.getElementById('btn-backup-teste').addEventListener('click', () => {
        alert("O botão de teste está a funcionar perfeitamente!");
      });
    });
  </script>
</body>
</html>
