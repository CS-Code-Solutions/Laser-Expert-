<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" href="img/ico1.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laser Expert</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0B132B 0%, #1C2541 50%, #3A506B 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card img {
            max-width: 150px;
            height: auto;
            margin-bottom: 15px;
        }
        h2 { color: #333; margin-bottom: 20px; font-size: 1.2rem; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #555; font-size: 0.85rem; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; background: #00F5D4; color: #0B132B; border: none; padding: 12px; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        button:hover { background: #00ddbe; }
        #error-msg { color: #EF4444; margin-top: 10px; font-size: 0.85rem; font-weight: bold; text-align: left; background: #FEF2F2; padding: 8px; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="logo.png" alt="Laser Expert">
        <h2>Acesso ao Sistema</h2>
        
        <form id="login-form">
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" id="email" required placeholder="exemplo@email.com">
            </div>
            <div class="form-group">
                <label>Palavra-passe:</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" id="btn-login">Entrar</button>
            <div id="error-msg"></div>
        </form>

        <div style="margin-top: 25px; font-size: 11px; color: #94A3B8; font-weight: 500;">
            Powered by CS Code Solutions
        </div>
    </div>

    <!-- Script Modular com verificação de segurança -->
    <script type="module">
        import { auth } from './js/firebase-config.js?v=2.0';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const btnLogin = document.getElementById('btn-login');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                errorMsg.style.display = 'none';
                errorMsg.textContent = "";
                btnLogin.disabled = true;
                btnLogin.textContent = "A entrar...";

                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    window.location.href = 'index.html';
                } catch (error) {
                    console.error("Erro no login:", error);
                    let msg = "E-mail ou palavra-passe incorretos.";
                    if (error.code === 'auth/too-many-requests') {
                        msg = "Muitas tentativas falhadas. Tente novamente mais tarde.";
                    } else if (error.code === 'auth/invalid-api-key') {
                        msg = "Erro de configuração da chave do Firebase.";
                    }
                    
                    errorMsg.textContent = msg;
                    errorMsg.style.display = 'block';
                    btnLogin.disabled = false;
                    btnLogin.textContent = "Entrar";
                }
            });
        }
    </script>
</body>
</html>
