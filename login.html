<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" href="img/ico1.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Laser Expert</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0B132B 0%, #1C2541 50%, #3A506B 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border-top: 4px solid #00F5D4;
        }
        .login-card img {
            max-width: 160px;
            height: auto;
            margin-bottom: 15px;
        }
        h2 { color: #0B132B; margin-bottom: 20px; font-size: 1.3rem; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #334155; font-size: 0.85rem; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.95rem; }
        input:focus { border-color: #00F5D4; outline: none; }
        button { width: 100%; background: #00F5D4; color: #0B132B; border: none; padding: 12px; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #00ddbe; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="logo.png" alt="Laser Expert">
        <h2>Acesso ao Sistema</h2>
        
        <form id="login-form">
            <div class="form-group">
                <label>E-mail:</label>
                <input type="email" id="email" required placeholder="exemplo@email.com">
            </div>
            <div class="form-group">
                <label>Palavra-passe:</label>
                <input type="password" id="password" required placeholder="********">
            </div>
            <button type="submit" id="btn-login">Entrar</button>
        </form>

        <div style="margin-top: 25px; font-size: 11px; color: #94A3B8; font-weight: 500;">
            Powered by CS Code Solutions
        </div>
    </div>

    <!-- Script de Acesso Direto (Sem Validação Firebase Auth) -->
    <script>
        const loginForm = document.getElementById('login-form');
        const btnLogin = document.getElementById('btn-login');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            btnLogin.disabled = true;
            btnLogin.textContent = "A entrar...";

            // Guarda um indicador local de sessão e redireciona
            localStorage.setItem('laser_logged', 'true');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
