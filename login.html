<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <link rel="icon" href="ico.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Expert - Iniciar Sessão</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Inicialização Centralizada Correta -->
  <script src="firebase-init.js"></script>

  <style>
    body {
      background-color: var(--deep-navy, #0B132B);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .login-card {
      background: #FFFFFF;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-card img.logo-login {
      max-width: 180px;
      margin-bottom: 20px;
    }
    .login-card h2 {
      color: var(--deep-navy, #0B132B);
      margin-bottom: 20px;
      font-size: 1.25rem;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #334155;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .btn-login {
      width: 100%;
      background-color: #00F5D4;
      color: #0B132B;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 10px;
    }
    .btn-login:hover {
      background-color: #00ddbe;
    }
    .btn-google {
      width: 100%;
      background-color: #FFFFFF;
      color: #334155;
      font-weight: bold;
      padding: 12px;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-google:hover {
      background-color: #F8FAFC;
      border-color: #94A3B8;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #64748B;
      font-size: 0.85rem;
      margin: 15px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #CBD5E1;
    }
    .divider::before { margin-right: .75em; }
    .divider::after { margin-left: .75em; }
    .login-footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #64748B;
    }
    #loginError {
      color: var(--danger, #EF4444);
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
      text-align: left;
      background: #FEE2E2;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #FCA5A5;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="logo.png" alt="Laser Expert Logo" class="logo-login">
    <h2>Iniciar Sessão</h2>
    
    <div id="loginError"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">E-mail:</label>
        <input type="email" id="loginEmail" placeholder="exemplo@laserexpert.com" required>
      </div>
      
      <div class="form-group">
        <label for="loginPassword">Palavra-passe:</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" id="btnLogin" class="btn-login">Entrar com E-mail</button>
    </form>

    <div class="divider">ou</div>

    <button type="button" id="btnGoogle" class="btn-google" onclick="handleGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.52 0 9s.35 2.85.95 4.04l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
      Entrar com Conta Google
    </button>

    <div class="login-footer">
      <p>&copy; 2026 Laser Expert | Powered by <strong>CS Code Solutions</strong></p>
    </div>
  </div>

  <script>
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function validarWhitelist(emailUser) {
      try {
        const docRef = await db.collection('laser_expert_data').doc('rg_allowed_emails').get();
        if (!docRef.exists) return false;
        
        const data = docRef.data();
        const listaEmails = data.content || [];
        return Array.isArray(listaEmails) && listaEmails.includes(emailUser.toLowerCase().trim());
      } catch (err) {
        console.error("Erro ao verificar whitelist:", err);
        return false;
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const emailInput = document.getElementById('loginEmail').value.trim();
      const passwordInput = document.getElementById('loginPassword').value.trim();
      const errorBox = document.getElementById('loginError');
      const btnLogin = document.getElementById('btnLogin');

      errorBox.style.display = 'none';
      errorBox.textContent = '';

      try {
        btnLogin.disabled = true;
        btnLogin.textContent = 'A autenticar...';

        const userCredential = await firebase.auth().signInWithEmailAndPassword(emailInput, passwordInput);
        const userEmail = userCredential.user.email;

        const autorizado = await validarWhitelist(userEmail);
        if (!autorizado) {
          await firebase.auth().signOut();
          throw new Error(`O e-mail (${userEmail}) não está autorizado a aceder a este sistema.`);
        }

        localStorage.setItem('rg_logged', 'true');
        localStorage.setItem('rg_user_email', escapeHTML(userEmail));
        window.location.href = 'index.html';

      } catch (error) {
        console.error("Erro no login:", error);
        errorBox.textContent = error.message.includes('não está autorizado') ? error.message : 'E-mail ou palavra-passe incorretos ou sem permissão.';
        errorBox.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar com E-mail';
      }
    }

    async function handleGoogleLogin() {
      const errorBox = document.getElementById('loginError');
      const btnGoogle = document.getElementById('btnGoogle');

      errorBox.style.display = 'none';
      errorBox.textContent = '';

      try {
        btnGoogle.disabled = true;
        btnGoogle.textContent = 'A ligar à Google...';

        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await firebase.auth().signInWithPopup(provider);
        const userEmail = result.user.email;

        const autorizado = await validarWhitelist(userEmail);
        
        if (!autorizado) {
          await firebase.auth().signOut();
          throw new Error(`Acesso negado: O e-mail Google (${userEmail}) não possui autorização de acesso.`);
        }

        localStorage.setItem('rg_logged', 'true');
        localStorage.setItem('rg_user_email', escapeHTML(userEmail));
        window.location.href = 'index.html';

      } catch (error) {
        console.error("Erro no login Google:", error);
        errorBox.textContent = error.message || 'Erro ao autenticar com a conta Google.';
        errorBox.style.display = 'block';
        btnGoogle.disabled = false;
        btnGoogle.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.95C.35 6.15 0 7.52 0 9s.35 2.85.95 4.04l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.96l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg> Entrar com Conta Google`;
      }
    }
  </script>

</body>
</html>
