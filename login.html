<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <link rel="icon" href="img/ico.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Expert - Iniciar Sessão</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: var(--deep-navy, #0B132B);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    .login-card {
      background: #FFFFFF;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-card img.logo-login {
      max-width: 180px;
      margin-bottom: 20px;
    }
    .login-card h2 {
      color: var(--deep-navy, #0B132B);
      margin-bottom: 20px;
      font-size: 1.25rem;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #334155;
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #CBD5E1;
      border-radius: 4px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    .btn-login {
      width: 100%;
      background-color: #00F5D4;
      color: #0B132B;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover {
      background-color: #00ddbe;
    }
    .login-footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #64748B;
    }
    #loginError {
      color: var(--danger, #EF4444);
      font-size: 0.85rem;
      margin-bottom: 15px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <img src="logo.png" alt="Laser Expert Logo" class="logo-login">
    <h2>Iniciar Sessão</h2>
    
    <div id="loginError"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">E-mail:</label>
        <input type="email" id="loginEmail" placeholder="exemplo@laserexpert.com" required>
      </div>
      
      <div class="form-group">
        <label for="loginPassword">Palavra-passe:</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div class="login-footer">
      <p>&copy; 2026 Laser Expert | Powered by <strong>CS Code Solutions</strong></p>
    </div>
  </div>

  <script>
    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function handleLogin(event) {
      event.preventDefault();
      const emailInput = document.getElementById('loginEmail').value.trim();
      const passwordInput = document.getElementById('loginPassword').value.trim();
      const errorBox = document.getElementById('loginError');

      errorBox.style.display = 'none';
      errorBox.textContent = '';

      // Validação de preenchimento e formato básico
      if (!emailInput || !passwordInput) {
        errorBox.textContent = 'Por favor, preencha todos os campos.';
        errorBox.style.display = 'block';
        return;
      }

      // Validação simples de formato de e-mail
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(emailInput)) {
        errorBox.textContent = 'Por favor, introduza um endereço de e-mail válido.';
        errorBox.style.display = 'block';
        return;
      }

      // Registo de sessão local e redirecionamento seguro
      localStorage.setItem('rg_logged', 'true');
      localStorage.setItem('rg_user_email', escapeHTML(emailInput));
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
