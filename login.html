<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Firebase SDKs Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- Inicialização Direta Embutida (Sem dependência de ficheiros externos para evitar cache) -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDWoTDe-LCuHg1GriVFHmVhAyNIL06PRr0",
      authDomain: "otavio-b80a5.firebaseapp.com",
      projectId: "otavio-b80a5",
      storageBucket: "otavio-b80a5.firebasestorage.app",
      messagingSenderId: "54639570167",
      appId: "1:54639570167:web:b68950efc1bce86495b7f2"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
  </script>

  <link rel="icon" href="img/ico1.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Expert - Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body.login-page {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0B132B 0%, #1C2541 50%, #3A506B 100%);
      background-image: 
        radial-gradient(rgba(0, 245, 212, 0.1) 1px, transparent 1px),
        linear-gradient(135deg, #0B132B 0%, #1C2541 100%);
      background-size: 30px 30px, 100% 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      padding: 35px 30px;
      text-align: center;
      border-top: 4px solid #00F5D4;
    }

    .login-card img.logo-login {
      max-width: 180px;
      height: auto;
      margin-bottom: 25px;
    }

    .login-card h2 {
      font-size: 1.2rem;
      color: #0B132B;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #334155;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #CBD5E1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      border-color: #00F5D4;
      box-shadow: 0 0 0 3px rgba(0, 245, 212, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #00F5D4;
      color: #0B132B;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #00ddbe;
    }

    .login-error {
      color: #EF4444;
      font-size: 0.85rem;
      margin-top: 12px;
      display: none;
      font-weight: bold;
      background: #FEF2F2;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #FCA5A5;
      text-align: left;
      word-break: break-all;
    }

    .login-footer {
      margin-top: 25px;
      font-size: 0.75rem;
      color: #94A3B8;
    }

    .login-footer strong {
      color: #00F5D4;
    }
  </style>
</head>
<body class="login-page">

  <div class="login-container">
    <div class="login-card">
      <img src="logo.png" alt="Laser Expert Logo" class="logo-login">
      <h2>Acesso ao Sistema de RS</h2>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail de Acesso</label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="senha">Palavra-passe</label>
          <input type="password" id="senha" required>
        </div>

        <div id="loginError" class="login-error"></div>

        <button type="submit" id="submitBtn" class="btn-login">ENTRAR</button>
      </form>

      <div class="login-footer">
        <p>&copy; 2026 Laser Expert | Powered by <strong>CS Code Solutions</strong></p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('senha').value.trim();
      const errorBox = document.getElementById('loginError');
      const submitBtn = document.getElementById('submitBtn');

      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'A AUTENTICAR...';

      try {
        await firebase.auth().signInWithEmailAndPassword(email, password);

        localStorage.setItem('rg_logged', 'true');
        localStorage.setItem('rg_user_email', email);
        window.location.href = 'index.html';
      } catch (err) {
        console.error("Erro no login Firebase Auth:", err);
        let msg = 'E-mail ou palavra-passe incorretos.';
        if (err.code === 'auth/invalid-email') {
          msg = 'Formato de e-mail inválido.';
        } else if (err.code === 'auth/user-not-found') {
          msg = 'Utilizador não encontrado no Firebase.';
        } else if (err.code === 'auth/wrong-password') {
          msg = 'Palavra-passe incorreta.';
        } else {
          msg = `Erro Firebase [${err.code}]: ${err.message}`;
        }

        errorBox.textContent = msg;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'ENTRAR';
      }
    });
  </script>

</body>
</html>
