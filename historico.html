<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--link rel="icon" href="img/ico1.png" type="image/png"-->
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Expert - Histórico de RS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @media print {
      header, footer, .no-print { display: none !important; }
      body { background: white; color: black; padding: 0; margin: 0; }
      .card { box-shadow: none; border: none; padding: 0; margin: 0; }
      .page-break { page-break-before: always; }
    }
  </style>
</head>
<body>

  <header class="no-print">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Clientes</a></li>
          <li><a href="maquinas.html">Máquinas</a></li>
          <li><a href="novo-relatorio.html">Novo Relatório</a></li>
          <li><a href="historico.html" class="active">Histórico RS</a></li>
          <li><a href="configuracao.html">Configuração</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Histórico de Relatórios de Serviço (RS)</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nº RS</th>
              <th>Data</th>
              <th>Cliente</th>
              <th>Equipamento</th>
              <th>Tipo</th>
              <th class="no-print">Ações</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="6" style="text-align: center; color: #64748B;">A carregar histórico...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="no-print">
    <p>&copy; 2026 Laser Expert — Todos os direitos reservados.</p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      renderHistory();
    });

    function renderHistory() {
      const historyTableBody = document.getElementById('historyTableBody');
      if (!historyTableBody) return;

      let reports = [];
      try {
        const rawData = localStorage.getItem('rg_reports');
        if (rawData) {
          const parsed = JSON.parse(rawData);
          if (Array.isArray(parsed)) {
            reports = parsed;
          }
        }
      } catch (e) {
        console.error("Erro ao ler relatórios:", e);
        reports = [];
      }

      historyTableBody.innerHTML = '';

      if (reports.length === 0) {
        historyTableBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #64748B;">Nenhum relatório de serviço registrado.</td></tr>';
        return;
      }

      let htmlRows = '';
      reports.forEach((rep, index) => {
        if (!rep) return;
        htmlRows += `
          <tr>
            <td><strong>${rep.number || 'RS-1000'}</strong></td>
            <td>${rep.date || '-'}</td>
            <td>${rep.client || '-'}</td>
            <td>${rep.equipment || '-'}</td>
            <td>${rep.serviceNature || rep.type || '-'}</td>
            <td class="no-print" style="display: flex; gap: 5px; flex-wrap: wrap;">
              <button class="btn" style="padding: 4px 8px; font-size: 0.8rem; background-color: #1D4ED8;" onclick="printReport(${index})">Gerar RS</button>
              <button class="btn" style="padding: 4px 8px; font-size: 0.8rem; background-color: #F59E0B;" onclick="editReport(${index})">Editar</button>
              <button class="btn" style="padding: 4px 8px; font-size: 0.8rem; background-color: #EF4444;" onclick="deleteReport(${index})">Excluir</button>
            </td>
          </tr>
        `;
      });
      historyTableBody.innerHTML = htmlRows;
    }

    window.deleteReport = function(index) {
      if(confirm('Deseja realmente excluir este relatório?')) {
        try {
          let reports = JSON.parse(localStorage.getItem('rg_reports')) || [];
          reports.splice(index, 1);
          localStorage.setItem('rg_reports', JSON.stringify(reports));
          renderHistory();
        } catch (e) {
          alert('Erro ao excluir relatório.');
        }
      }
    };

    window.editReport = function(index) {
      window.location.href = `novo-relatorio.html?edit=${index}`;
    };

    function calcularMinutosTrabalhados(startM, endM, startT, endT, valorHoraFixo = 200.00) {
        let minutosTotais = 0;
        if (startM && endM) {
            const diffM = new Date(endM) - new Date(startM);
            if (diffM > 0) minutosTotais += diffM / (1000 * 60);
        }
        if (startT && endT) {
            const diffT = new Date(endT) - new Date(startT);
            if (diffT > 0) minutosTotais += diffT / (1000 * 60);
        }
        if (minutosTotais < 0) minutosTotais = 0;
        const horasDecimais = minutosTotais / 60;
        const valorHorasTotal = horasDecimais * Number(valorHoraFixo);
        const horasExatas = Math.floor(minutosTotais / 60);
        const minutosRestantes = Math.round(minutosTotais % 60);
        return {
            totalHoursText: `${horasExatas}h ${minutosRestantes}m`,
            valorHorasTotal: valorHorasTotal
        };
    }

    function gerarPayloadPix(chave, nome, cidade, valor, txid = "***") {
        const chaveLimpa = chave.replace(/\D/g, '');
        const format = (id, val) => {
            const len = String(val.length).padStart(2, '0');
            return `${id}${len}${val}`;
        };
        const normalize = (str) => {
            return str ? str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase() : "";
        };
        nome = normalize(nome).substring(0, 25);
        cidade = normalize(cidade).substring(0, 15);

        let gui = format("00", "br.gov.bcb.pix");
        let key = format("01", chaveLimpa);
        let merchantAccountInformation = format("26", gui + key);
        let mcc = format("52", "0000");
        let currency = format("53", "986");
        let amountStr = format("54", Number(valor).toFixed(2));
        let country = format("58", "BR");
        let merchantName = format("59", nome);
        let merchantCity = format("60", cidade);
        let additionalDataField = format("62", format("05", txid));
        
        let payloadWithoutCrc = merchantAccountInformation + mcc + currency + amountStr + country + merchantName + merchantCity + additionalDataField;
        let payload = format("00", "01") + payloadWithoutCrc + "6304";
        
        let crc = 0xFFFF;
        for (let i = 0; i < payload.length; i++) {
            crc ^= payload.charCodeAt(i) << 8;
            for (let j = 0; j < 8; j++) {
                if ((crc & 0x8000) !== 0) {
                    crc = ((crc << 1) ^ 0x1021);
                } else {
                    crc = (crc << 1);
                }
                crc &= 0xFFFF;
            }
        }
        let crcHex = crc.toString(16).toUpperCase().padStart(4, '0');
        return payload + crcHex;
    }

    window.printReport = function(index) {
      let reports = [];
      try {
        reports = JSON.parse(localStorage.getItem('rg_reports')) || [];
      } catch (e) { reports = []; }

      const rep = reports[index];
      if (!rep) {
        alert("Relatório não encontrado.");
        return;
      }
      
      const config = JSON.parse(localStorage.getItem('rg_config')) || { 
        name: 'LASER EXPERT SERVICO E COMERCIO DE PECAS LTDA', 
        tech: 'Otávio Barbosa',
        doc: '48.959.536/0001-65',
        contact: '+55 51 98144-1865',
        location: 'Rua Corte Real 487 – Scharlau – São Leopoldo – RS',
        pix: 'comercial@laserexpertbr.com.br',
        bank: '', agency: '', account: ''
      };

      let clients = [];
      try {
        const cData = JSON.parse(localStorage.getItem('rg_clients'));
        if (Array.isArray(cData)) clients = cData;
      } catch (e) {}
      const clientObj = clients.find(c => c.name === rep.client) || {};

      let valorHorasTotal = 0;
      let textoHoras = "Não cobrado";
      if (rep.temHora === 'sim') {
          const valorHora = Number(rep.valorHora) || 200.00;
          const horasCalc = calcularMinutosTrabalhados(rep.startManha, rep.endManha, rep.startTarde, rep.endTarde, valorHora);
          valorHorasTotal = horasCalc.valorHorasTotal;
          textoHoras = `${horasCalc.totalHoursText} (R$ ${valorHorasTotal.toFixed(2)})`;
      }

      let valorKmTotal = 0;
      let kmTotal = 0;
      if (rep.temKm === 'sim') {
          kmTotal = (Number(rep.kmIda) || 0) + (Number(rep.kmVolta) || 0);
          valorKmTotal = kmTotal * (Number(rep.valorKm) || 0);
      }

      let valorCombustivelTotal = 0;
      if (rep.temCombustivel === 'sim') {
          valorCombustivelTotal = (Number(rep.combustivelLitros) || 0) * (Number(rep.valorLitro) || 0);
      }

      let valorAdicional = 0;
      if (rep.temDespesas === 'sim') {
          valorAdicional = Number(rep.valorAdicional) || 0;
      }

      const valorTotal = (valorHorasTotal + valorKmTotal + valorCombustivelTotal + valorAdicional).toFixed(2);

      let pixPayload = "";
      let qrCodeUrl = "";
      if (config.pix) {
          pixPayload = gerarPayloadPix(config.pix, config.name, "Sao Leopoldo", valorTotal);
          qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(pixPayload)}`;
      }

      const kmHtml = rep.temKm === 'sim' ? '<p>• <strong>Quilômetros Rodados:</strong> ' + kmTotal + ' km (' + (rep.kmIda || 0) + ' Ida / ' + (rep.kmVolta || 0) + ' Volta) a R$ ' + Number(rep.valorKm || 0).toFixed(2) + '/km = R$ ' + valorKmTotal.toFixed(2) + '</p>' : '';
      const combustivelHtml = rep.temCombustivel === 'sim' ? '<p>• <strong>Combustível:</strong> ' + (rep.combustivelLitros || 0) + ' L a R$ ' + Number(rep.valorLitro || 0).toFixed(2) + '/L = R$ ' + valorCombustivelTotal.toFixed(2) + '</p>' : '';
      const despesasHtml = rep.temDespesas === 'sim' ? '<p>• <strong>Outras Despesas / Pedágio:</strong> R$ ' + valorAdicional.toFixed(2) + '</p>' : '';

      const bankInfoHtml = config.bank ? '<p><strong>Banco:</strong> ' + config.bank + ' | <strong>Ag:</strong> ' + config.agency + ' | <strong>CC:</strong> ' + config.account + '</p>' : '';
      const pixSectionHtml = config.pix ? `
        <div class="section-box" style="display: flex; justify-content: space-between; align-items: center; page-break-inside: avoid;">
          <div>
            <div class="section-title" style="border:none; margin-bottom:4px; padding:0;">Dados Bancários / Pagamento PIX</div>
            <p><strong>Chave PIX:</strong> ${config.pix}</p>
            ` + bankInfoHtml + `
            <p style="font-size: 10px; color: #555; margin-top: 6px;">Escaneie o QR Code com o aplicativo do banco para pagar.</p>
          </div>
          <div style="text-align: center; background: #FFF; padding: 6px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <img src="${qrCodeUrl}" alt="QR Code PIX" style="width: 110px; height: 110px; display: block; margin: 0 auto;">
            <span style="font-size: 9px; font-weight: bold; display: block; margin-top: 2px;">PIX Copia e Cola</span>
          </div>
        </div>` : '';

      let anexosHtml = '';
      if (rep.anexos && rep.anexos.length > 0) {
        let itemsHtml = '';
        rep.anexos.forEach(anexo => {
          itemsHtml += `
            <div class="section-box" style="text-align: center; page-break-inside: avoid;">
              <div class="section-title" style="text-align: left;">${anexo.titulo || 'Foto do Equipamento'}</div>
              <img src="${anexo.imagem}" alt="${anexo.titulo || ''}" style="max-width: 100%; max-height: 450px; height: auto; object-fit: contain; border-radius: 4px; border: 1px solid #CBD5E1; display: block; margin: 0 auto;">
            </div>
          `;
        });
        anexosHtml = `
          <div class="page-break"></div>
          <div class="print-header" style="margin-top: 10px;">
            <img src="logo.png" alt="Logo">
            <div class="print-header-info">
              <h1>ANEXOS / FOTOGRAFIAS DO EQUIPAMENTO</h1>
              <p><strong>RS Nº:</strong> ${rep.number} | <strong>Cliente:</strong> ${rep.client}</p>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 15px;">
            ${itemsHtml}
          </div>
        `;
      }

      const printWindow = window.open('', '_blank');
      printWindow.document.write(`
        <html>
        <head>
          <title>Relatório de Serviço - ${rep.number}</title>
          <style>
            body { font-family: Arial, sans-serif; color: #0B132B; padding: 20px; line-height: 1.4; font-size: 12px; }
            .print-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00F5D4; padding-bottom: 10px; margin-bottom: 15px; }
            .print-header img { height: 50px; width: auto; }
            .print-header-info { text-align: right; }
            .print-header-info h1 { font-size: 15px; color: #0B132B; margin: 0; font-weight: bold; }
            .print-header-info p { font-size: 10px; color: #333; margin: 1px 0; }
            .section-box { border: 1px solid #CBD5E1; padding: 12px; margin-bottom: 12px; border-radius: 6px; background: #F8FAFC; }
            .section-title { font-weight: bold; font-size: 13px; color: #0B132B; margin-bottom: 8px; border-bottom: 1px solid #E2E8F0; padding-bottom: 4px; }
            .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            p { margin: 3px 0; }
            .signature-area { margin-top: 25px; display: flex; justify-content: space-between; align-items: flex-end; page-break-inside: avoid; }
            .signature-box { text-align: center; width: 45%; }
            .signature-box img { max-width: 200px; height: 55px; object-fit: contain; display: block; margin: 0 auto; border-bottom: 1px solid #000; }
            .page-break { page-break-before: always; }
          </style>
        </head>
        <body>
          <div class="print-header">
            <img src="logo.png" alt="Logo">
            <div class="print-header-info">
              <h1>RELATÓRIO DE SERVIÇO (RS)</h1>
              <p><strong>${config.name}</strong></p>
              <p>CNPJ: ${config.doc} | Fone/WhatsApp: ${config.contact}</p>
              <p>${config.location}</p>
            </div>
          </div>

          <div class="section-box">
            <div class="section-title">Dados do Cliente</div>
            <div class="grid-2">
              <p><strong>Nome / Razão Social:</strong> ${rep.client}</p>
              <p><strong>CPF / CNPJ:</strong> ${clientObj.doc || clientObj.cnpj || '-'}</p>
              <p><strong>E-mail:</strong> ${clientObj.email || '-'}</p>
              <p><strong>Endereço:</strong> ${clientObj.address || '-'}</p>
            </div>
          </div>

          <div class="section-box">
            <div class="section-title">Dados do Equipamento / Máquina</div>
            <div class="grid-2">
              <p><strong>Equipamento:</strong> ${rep.equipment || '-'}</p>
              <p><strong>Marca:</strong> ${rep.brand || '-'}</p>
              <p><strong>Modelo:</strong> ${rep.model || '-'}</p>
              <p><strong>Matrícula / N° de Série:</strong> ${rep.serialNumber || '-'}</p>
            </div>
          </div>

          <div class="section-box">
            <div class="section-title">Registro do Serviço Realizado</div>
            <div class="grid-2" style="margin-bottom: 6px;">
              <p><strong>Nº do RS:</strong> ${rep.number}</p>
              <p><strong>Data:</strong> ${rep.date}</p>
              <p><strong>Tipo de Manutenção:</strong> ${rep.serviceNature || '-'}</p>
              <p><strong>Área de Serviço:</strong> ${rep.serviceArea || '-'}</p>
            </div>
            <p><strong>Descrição Detalhada:</strong></p>
            <p style="white-space: pre-wrap; margin-top: 4px; background: #FFF; padding: 8px; border: 1px solid #E2E8F0; border-radius: 4px;">${rep.desc || '-'}</p>
          </div>

          <div class="section-box">
            <div class="section-title">Critérios de Cobrança e Valor Total</div>
            <div style="font-size: 11px; margin-bottom: 8px;">
              <p>• <strong>Horas Trabalhadas:</strong> ${textoHoras}</p>
              ${kmHtml}
              ${combustivelHtml}
              ${despesasHtml}
              <p>• <strong>Condição de Pagamento:</strong> ${rep.paymentTerms || '-'} dias</p>
            </div>
            <div style="background: #E2E8F0; padding: 8px; border-radius: 4px; font-weight: bold; text-align: right; font-size: 13px; color: #0B132B;">
              TOTAL DO SERVIÇO: R$ ${valorTotal}
            </div>
          </div>

          ${pixSectionHtml}

          <div class="signature-area">
            <div class="signature-box">
              ${rep.techSignature ? `<img src="${rep.techSignature}" alt="Assinatura Técnico">` : '<p style="height: 55px;"></p>'}
              <p>________________________________________</p>
              <p><strong>Técnico Responsável:</strong> ${rep.technician || config.tech || 'Otávio Barbosa'}</p>
            </div>
            <div class="signature-box">
              ${rep.signature ? `<img src="${rep.signature}" alt="Assinatura Cliente">` : '<p style="height: 55px;"></p>'}
              <p>________________________________________</p>
              <p><strong>Assinatura do Cliente</strong></p>
            </div>
          </div>

          ${anexosHtml}
        </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.print();
    }
  </script>

</body>
</html>
