<html lang="pt-PT">
<head>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link rel="icon" href="ico.png" type="image/png">
  <meta charset="UTF-8">

  <title>Laser Expert - Novo Relatório de Serviço</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0B132B">

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Laser Expert">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Clientes</a></li>
          <li><a href="maquinas.html">Máquinas</a></li>
          <li><a href="novo-relatorio.html" class="active">Novo Relatório</a></li>

  <main>
    <section class="card">
      <h2 id="pageTitle">Novo Relatório de Serviço (RS)</h2>
      
      <form id="reportForm">
        <!-- Seleção de Cliente -->
        <div class="form-group">
          <label for="reportClient">Cliente / Empresa</label>
          <select id="reportClient" required>
            <option value="">A carregar clientes...</option>
          </select>
        </div>

        <!-- Seleção de Máquina Cadastrada -->
        <div class="form-group">
          <label for="machineSelect">Equipamento (Cadastrado)</label>
          <select id="machineSelect">
            <option value="">Selecione o cliente primeiro...</option>
          </select>
        </div>

        <!-- Dados do Equipamento -->
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="equipment">Nome / Equipamento</label>
            <input type="text" id="equipment" required placeholder="Ex: Centro de Usinagem">
          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="brand">Marca</label>
            <input type="text" id="brand" placeholder="Ex: Trumpf / Bystronic">
          </div>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="model">Modelo</label>
            <input type="text" id="model" placeholder="Ex: TruLaser 3030">
          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="serial-number">Matrícula / N° de Série</label>
            <input type="text" id="serial-number" placeholder="Ex: SN-99823">
          </div>
        </div>

        <!-- Número e Data do RS -->
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="reportNumber">Número do RS (Automático)</label>
            <input type="text" id="reportNumber" required readonly style="background: var(--ice-white); font-weight: bold; color: var(--tech-blue);">
          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="reportDate">Data do Atendimento</label>
            <input type="date" id="reportDate" required>
          </div>
        </div>

        <!-- Tipo e Área de Serviço -->
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="service-nature">Tipo de Manutenção</label>
            <select id="service-nature">
              <option value="Manutenção Corretiva">Corretiva</option>
              <option value="Manutenção Preventiva/Preditiva">Preventiva / Preditiva</option>
              <option value="Garantia">Garantia</option>
              <option value="Suporte Técnico / Outros">Outros</option>

          </div>
          <div class="form-group" style="flex: 1; min-width: 200px;">
            <label for="service-area">Área de Serviço</label>
            <select id="service-area" required>
              <option value="Elétrica">Elétrica</option>
              <option value="Mecânica">Mecânica</option>
              <option value="Eletrônica">Eletrônica</option>
              <option value="Hidráulica">Hidráulica</option>
              <option value="Óptica / Laser">Óptica / Laser</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
        </div>

        <!-- CRITÉRIOS DE COBRANÇA E DESLOCAÇÃO -->
        <div style="background: #F8FAFC; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #CBD5E1;">
            <h3 style="font-size: 15px; margin-top: 0; color: var(--deep-navy); margin-bottom: 15px;">Critérios de Cobrança e Deslocação</h3>
            
            <div class="form-group">
                <label for="tem-empreitada">Valor total do serviço (Cobrar por Empreitada)?</label>
                <select id="tem-empreitada">
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>
            </div>

            <div id="bloco-empreitada" style="display: none; background: #FFF; padding: 12px; border-radius: 4px; border: 1px solid #CBD5E1; margin-bottom: 15px;">
                <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor total do serviço (R$):</label>
                <input type="number" step="0.01" id="valor-empreitada" placeholder="Ex: 1500.00" style="width: 100%; padding: 6px; box-sizing: border-box;">
            </div>

            <div id="bloco-horas-geral">
                <div class="form-group">
                    <label for="tem-hora">Cobrar Hora Trabalhada?</label>
                    <select id="tem-hora">
                        <option value="sim">Sim</option>
                        <option value="nao">Não</option>
                    </select>
                </div>

                <div id="bloco-turnos" style="background: #FFF; padding: 12px; border-radius: 4px; border: 1px solid #CBD5E1; margin-bottom: 15px;">
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor da Hora (R$):</label>
                        <input type="number" step="0.01" id="valor-hora" value="200.00" style="width: 100%; padding: 6px; box-sizing: border-box;">
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;">
                        <div style="flex: 1; min-width: 180px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Início Manhã:</label>
                            <input type="datetime-local" id="time-start-manha" style="width: 100%; padding: 6px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 180px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Final Manhã:</label>
                            <input type="datetime-local" id="time-end-manha" style="width: 100%; padding: 6px; box-sizing: border-box;">
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <div style="flex: 1; min-width: 180px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Início Tarde:</label>
                            <input type="datetime-local" id="time-start-tarde" style="width: 100%; padding: 6px; box-sizing: border-box;">
                        </div>
                        <div style="flex: 1; min-width: 180px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Final Tarde (Encerramento):</label>
                            <input type="datetime-local" id="time-end-tarde" style="width: 100%; padding: 6px; box-sizing: border-box;">
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="tem-km">Cobrar Km Rodado?</label>
                <select id="tem-km">
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>
            </div>

            <div id="bloco-km" style="display: none; background: #FFF; padding: 12px; border-radius: 4px; border: 1px solid #CBD5E1; margin-bottom: 15px;">
                <div style="margin-bottom: 10px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor por Km (R$):</label>
                    <input type="number" step="0.01" id="valor-km" placeholder="Ex: 2.50" style="width: 100%; padding: 6px; box-sizing: border-box;">
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 180px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Km Ida:</label>
                        <input type="number" step="0.1" id="km-ida" placeholder="Ex: 50" style="width: 100%; padding: 6px; box-sizing: border-box;">
                    </div>
                    <div style="flex: 1; min-width: 180px;">
                        <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Km Volta:</label>
                        <input type="number" step="0.1" id="km-volta" placeholder="Ex: 50" style="width: 100%; padding: 6px; box-sizing: border-box;">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="tem-combustivel">Adicionar Combustível?</label>
                <select id="tem-combustivel">
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>
            </div>

            <div id="bloco-combustivel" style="display: none; background: #FFF; padding: 12px; border-radius: 4px; border: 1px solid #CBD5E1; margin-bottom: 15px;">
                <div style="margin-bottom: 10px;">
                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor por Litro (R$):</label>
                    <input type="number" step="0.01" id="valor-litro" placeholder="Ex: 6.00" style="width: 100%; padding: 6px; box-sizing: border-box;">
                </div>
                <div>
                    <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Quantidade (Litros):</label>
                    <input type="number" step="0.1" id="combustivel-litros" placeholder="Ex: 15.5" style="width: 100%; padding: 6px; box-sizing: border-box;">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="tem-despesas">Adicionar Outras Despesas (Pedágios, Alimentação, Hospedagem)?</label>
                <select id="tem-despesas">
                    <option value="nao">Não</option>
                    <option value="sim">Sim</option>
                </select>
            </div>

            <div id="bloco-despesas" style="display: none; background: #FFF; padding: 12px; border-radius: 4px; border: 1px solid #CBD5E1; margin-top: 10px;">
                <label style="display: block; font-weight: bold; margin-bottom: 3px; font-size: 12px;">Valor Total de Outras Despesas (R$):</label>
                <input type="number" step="0.01" id="valor-adicional" placeholder="Ex: 45.00" style="width: 100%; padding: 6px; box-sizing: border-box;">
            </div>
        </div>

        <!-- ANEXOS DINÂMICOS -->
        <div style="background: #F8FAFC; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #CBD5E1;">
            <label style="display: block; font-weight: bold; margin-bottom: 10px; color: var(--deep-navy);">Anexos / Fotos do Equipamento (Compactação Automática)</label>
            <div id="container-anexos" style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px;">
                <div class="anexo-row" style="display: flex; gap: 10px; align-items: center; background: #FFF; padding: 10px; border-radius: 4px; border: 1px solid #CBD5E1; flex-wrap: wrap;">
                    <input type="text" placeholder="Descrição da foto (Ex: Antes da Intervenção)" class="anexo-titulo" style="flex: 2; min-width: 180px; padding: 6px; box-sizing: border-box;">
                    <input type="file" accept="image/*" class="anexo-ficheiro" style="flex: 2; min-width: 180px; padding: 4px;">
                </div>
            </div>
            <button type="button" id="btn-adicionar-anexo" class="btn" style="background: var(--tech-blue); padding: 6px 12px; font-size: 0.85rem;">+ Adicionar outro anexo</button>
        </div>

        <div class="form-group">
          <label for="technician-name">Técnico Responsável</label>
          <input type="text" id="technician-name" required>
        </div>

        <div class="form-group">
          <label for="description">Descrição dos Trabalhos Realizados</label>
          <textarea id="description" rows="4" required placeholder="Descreva detalhadamente o serviço executado..."></textarea>
        </div>

        <div class="form-group">
          <label for="payment-terms">Condição de Pagamento (Dias)</label>
          <input type="text" id="payment-terms" placeholder="Ex: 30" required>
        </div>

        <!-- Assinaturas -->
        <div class="form-group" style="margin-top: 15px;">
          <label>Assinatura do Técnico Responsável</label>
          <canvas id="tech-pad" style="border: 1px solid #CBD5E1; width: 100%; height: 140px; background: #FFF; touch-action: none; border-radius: 6px;"></canvas>
          <button type="button" id="clear-tech" class="btn" style="margin-top: 5px; background: var(--slate-gray); padding: 5px 12px; font-size: 0.85rem;">Limpar Assinatura</button>
        </div>

        <div class="form-group" style="margin-top: 15px;">
          <label>Assinatura do Cliente</label>
          <canvas id="client-pad" style="border: 1px solid #CBD5E1; width: 100%; height: 140px; background: #FFF; touch-action: none; border-radius: 6px;"></canvas>
          <button type="button" id="clear-client" class="btn" style="margin-top: 5px; background: var(--slate-gray); padding: 5px 12px; font-size: 0.85rem;">Limpar Assinatura</button>
        </div>

        <div style="margin-top: 25px;">
          <button type="submit" id="submitBtn" class="btn btn-cyan" style="width: 100%; padding: 12px; font-size: 1.1rem;">Guardar Relatório de Serviço</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Laser Expert — Todos os direitos reservados. | Powered by <strong>CS Code Solutions</strong></p>
  </footer>

  <script>
    function comprimirImagem(file, maxWidth = 1200, maxHeight = 1200, quality = 0.8) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > height) {
              if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
            } else {
              if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
            }
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob((blob) => {
              if (!blob) { reject(new Error('Erro ao comprimir imagem.')); return; }
              resolve(new File([blob], file.name, { type: 'image/jpeg', lastModified: Date.now() }));
            }, 'image/jpeg', quality);
          };
          img.onerror = (error) => reject(error);
        };
        reader.onerror = (error) => reject(error);
      });
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('tem-empreitada').addEventListener('change', function() {
        const isEmpreitada = this.value === 'sim';
        document.getElementById('bloco-empreitada').style.display = isEmpreitada ? 'block' : 'none';
        document.getElementById('bloco-horas-geral').style.display = isEmpreitada ? 'none' : 'block';
    });

    document.getElementById('tem-hora').addEventListener('change', function() {
        document.getElementById('bloco-turnos').style.display = this.value === 'sim' ? 'block' : 'none';
    });
    document.getElementById('tem-km').addEventListener('change', function() {
        document.getElementById('bloco-km').style.display = this.value === 'sim' ? 'block' : 'none';
    });
    document.getElementById('tem-combustivel').addEventListener('change', function() {
        document.getElementById('bloco-combustivel').style.display = this.value === 'sim' ? 'block' : 'none';
    });
    document.getElementById('tem-despesas').addEventListener('change', function() {
        document.getElementById('bloco-despesas').style.display = this.value === 'sim' ? 'block' : 'none';
    });

    document.getElementById('btn-adicionar-anexo').addEventListener('click', function() {
        const container = document.getElementById('container-anexos');
        const novaLinha = document.createElement('div');
        novaLinha.className = 'anexo-row';
        novaLinha.style.cssText = 'display: flex; gap: 10px; align-items: center; background: #FFF; padding: 10px; border-radius: 4px; border: 1px solid #CBD5E1; flex-wrap: wrap;';
        novaLinha.innerHTML = `
            <input type="text" placeholder="Descrição da foto" class="anexo-titulo" style="flex: 2; min-width: 180px; padding: 6px; box-sizing: border-box;">
            <input type="file" accept="image/*" class="anexo-ficheiro" style="flex: 2; min-width: 180px; padding: 4px;">
            <button type="button" onclick="this.parentElement.remove()" class="btn" style="background: #EF4444; padding: 6px 10px; font-size: 0.8rem;">X</button>
        `;
        container.appendChild(novaLinha);
    });

    const clientSelect = document.getElementById('reportClient');
    const machineSelect = document.getElementById('machineSelect');
    const equipmentInput = document.getElementById('equipment');
    const brandInput = document.getElementById('brand');
    const modelInput = document.getElementById('model');
    const serialInput = document.getElementById('serial-number');
    const reportNumberInput = document.getElementById('reportNumber');
    const reportDateInput = document.getElementById('reportDate');
    const techNameInput = document.getElementById('technician-name');

    reportDateInput.valueAsDate = new Date();

    let clients = [];
    let machines = [];
    let reports = [];
    let config = { nextRs: '1001', tech: 'Otávio Barbosa' };

    const techCanvas = document.getElementById('tech-pad');
    const clientCanvas = document.getElementById('client-pad');
    const techPad = new SignaturePad(techCanvas);
    const clientPad = new SignaturePad(clientCanvas);

    document.getElementById('clear-tech').addEventListener('click', () => techPad.clear());
    document.getElementById('clear-client').addEventListener('click', () => clientPad.clear());

    function resizeCanvases() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      techCanvas.width = techCanvas.offsetWidth * ratio;
      techCanvas.height = techCanvas.offsetHeight * ratio;
      techCanvas.getContext("2d").scale(ratio, ratio);
      techPad.clear();

      clientCanvas.width = clientCanvas.offsetWidth * ratio;
      clientCanvas.height = clientCanvas.offsetHeight * ratio;
      clientCanvas.getContext("2d").scale(ratio, ratio);
      clientPad.clear();
    }
    window.addEventListener("resize", resizeCanvases);
    resizeCanvases();

    document.addEventListener("DOMContentLoaded", async () => {
      try {
        clients = await DataSync.load('rg_clients') || [];
        machines = await DataSync.load('rg_machines') || [];
        reports = await DataSync.load('rg_relatorios') || [];
        const savedCfg = await DataSync.load('rg_config');
        if (savedCfg) config = { ...config, ...savedCfg };

        if (techNameInput && !techNameInput.value) {
          techNameInput.value = config.tech || 'Otávio Barbosa';
        }

        let nextNum = 1001;
        if (reports.length > 0) {
          const numbers = reports.map(r => parseInt(r.number)).filter(n => !isNaN(n));
          if (numbers.length > 0) nextNum = Math.max(...numbers) + 1;
        } else if (config.nextRsNumber) {
          nextNum = parseInt(config.nextRsNumber);
        }
        reportNumberInput.value = nextNum;

        clientSelect.innerHTML = '<option value="">Selecione um cliente...</option>';
        clients.forEach(c => {
          clientSelect.innerHTML += `<option value="${c.name}">${c.name}</option>`;
        });
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
      }
    });

    clientSelect.addEventListener('change', function() {
      const selectedClient = this.value;
      machineSelect.innerHTML = '<option value="">Selecione uma máquina cadastrada...</option>';
      machines.forEach((m, index) => {
        if (m.client === selectedClient) {
          machineSelect.innerHTML += `<option value="${index}">${m.name} (${m.brand || ''} - ${m.model || ''})</option>`;
        }
      });
    });

    machineSelect.addEventListener('change', function() {
      const machineIndex = this.value;
      if (machineIndex === "") return;
      const m = machines[machineIndex];
      if (m) {
        equipmentInput.value = m.name || '';
        brandInput.value = m.brand || '';
        modelInput.value = m.model || '';
        serialInput.value = m.serial || '';
      }
    });

    document.getElementById('reportForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = '⏳ A processar e otimizar imagens...';

      try {
        const anexoRows = document.querySelectorAll('.anexo-row');
        const anexosProcessados = [];

        for (const row of anexoRows) {
          const tituloInput = row.querySelector('.anexo-titulo');
          const fileInput = row.querySelector('.anexo-ficheiro');
          if (fileInput.files && fileInput.files[0]) {
            const fotoComprimida = await comprimirImagem(fileInput.files[0], 1200, 1200, 0.8);
            const base64 = await fileToDataURL(fotoComprimida);
            anexosProcessados.push({
              title: tituloInput.value.trim() || 'Foto do Equipamento',
              url: base64
            });
          }
        }

        const newReport = {
          number: reportNumberInput.value,
          date: reportDateInput.value,
          client: clientSelect.value,
          equipment: equipmentInput.value,
          brand: brandInput.value,
          model: modelInput.value,
          serial: serialInput.value,
          nature: document.getElementById('service-nature').value,
          area: document.getElementById('service-area').value,
          empreitada: document.getElementById('tem-empreitada').value,
          valorEmpreitada: document.getElementById('valor-empreitada').value,
          temHora: document.getElementById('tem-hora').value,
          valorHora: document.getElementById('valor-hora').value,
          startManha: document.getElementById('time-start-manha').value,
          endManha: document.getElementById('time-end-manha').value,
          startTarde: document.getElementById('time-start-tarde').value,
          endTarde: document.getElementById('time-end-tarde').value,
          temKm: document.getElementById('tem-km').value,
          valorKm: document.getElementById('valor-km').value,
          kmIda: document.getElementById('km-ida').value,
          kmVolta: document.getElementById('km-volta').value,
          temCombustivel: document.getElementById('tem-combustivel').value,
          valorLitro: document.getElementById('valor-litro').value,
          litros: document.getElementById('combustivel-litros').value,
          temDespesas: document.getElementById('tem-despesas').value,
          valorAdicional: document.getElementById('valor-adicional').value,
          technician: techNameInput.value,
          description: document.getElementById('description').value,
          paymentTerms: document.getElementById('payment-terms').value,
          techSignature: techPad.isEmpty() ? '' : techPad.toDataURL(),
          signature: clientPad.isEmpty() ? '' : clientPad.toDataURL(),
          anexos: anexosProcessados
        };

        reports.push(newReport);
        await DataSync.save('rg_relatorios', reports);

        alert('Relatório guardado e sincronizado com sucesso!');
        window.location.href = 'historico.html';
      } catch (err) {
        console.error("Erro ao guardar relatório:", err);
        alert('Erro ao guardar o relatório: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar Relatório de Serviço';
      }
    });
  </script>
</body>
</html>
