<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <link rel="icon" href="img/ico.png" type="image/png">
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Expert - Novo Relatório de Serviço</title>
  <link rel="stylesheet" href="style.css">
  
<!-- Firebase SDKs Compat -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<!-- Inicialização Centralizada Correta -->
<script src="firebase-init.js"></script>

  <style>
    .signature-pad {
      border: 2px dashed #CBD5E1;
      background: #FFF;
      width: 100%;
      max-width: 400px;
      height: 150px;
      cursor: crosshair;
      touch-action: none;
      border-radius: 4px;
      display: block;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>

  <header class="no-print">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="Logo">
      </a>
      <nav>
        <ul>
          <li><a href="index.html">Clientes</a></li>
          <li><a href="maquinas.html">Máquinas</a></li>
          <li><a href="novo-relatorio.html" class="active">Novo Relatório</a></li>
          <li><a href="historico.html">Histórico RS</a></li>
          <li><a href="orcamentos.html">Orçamentos</a></li>
          <li><a href="configuracao.html">Configuração</a></li>
          <li><a href="login.html" onclick="localStorage.removeItem('rg_logged')" style="color: var(--danger); font-weight: bold;">Sair</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="card">
      <h2 id="formTitle">Novo Relatório de Serviço (RS)</h2>
      <form id="reportForm">
        <input type="hidden" id="editIndex" value="">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
          <div>
            <label for="repNumber"><strong>Nº do Relatório (RS):</strong></label>
            <input type="text" id="repNumber" required style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px;">
          </div>
          <div>
            <label for="repDate"><strong>Data do Atendimento:</strong></label>
            <input type="date" id="repDate" required style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px;">
          </div>
        </div>

        <div style="margin-bottom: 12px;">
          <label for="repClient"><strong>Cliente:</strong></label>
          <select id="repClient" required style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF;"></select>
        </div>

        <div style="margin-bottom: 12px;">
          <label for="repEquipment"><strong>Equipamento / Máquina:</strong></label>
          <select id="repEquipment" required style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF;">
            <option value="">Selecione primeiro um cliente...</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
          <div>
            <label for="repBrand"><strong>Marca:</strong></label>
            <input type="text" id="repBrand" placeholder="Ex: Raycus / IPG" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px;">
          </div>
          <div>
            <label for="repModel"><strong>Modelo:</strong></label>
            <input type="text" id="repModel" placeholder="Ex: LF-3015" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px;">
          </div>
        </div>

        <div style="margin-bottom: 12px;">
          <label for="repSerialNumber"><strong>Matrícula / N° de Série:</strong></label>
          <input type="text" id="repSerialNumber" placeholder="Número de série do equipamento" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px;">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;">
          <div>
            <label for="repServiceNature"><strong>Tipo de Manutenção:</strong></label>
            <select id="repServiceNature" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF;">
              <option value="Corretiva">Corretiva</option>
              <option value="Preventiva">Preventiva</option>
              <option value="Instalação">Instalação</option>
              <option value="Treinamento">Treinamento</option>
              <option value="Garantia">Garantia</option>
            </select>
          </div>
          <div>
            <label for="repServiceArea"><strong>Área de Serviço:</strong></label>
            <select id="repServiceArea" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF;">
              <option value="Mecânica">Mecânica</option>
              <option value="Elétrica">Elétrica</option>
            </select>
          </div>
        </div>

        <div style="margin-bottom: 15px;">
          <label for="repDesc"><strong>Descrição Detalhada do Serviço Realizado:</strong></label>
          <textarea id="repDesc" rows="5" placeholder="Descreva detalhadamente o que foi executado..." required style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; font-family:inherit;"></textarea>
        </div>

        <!-- CRITÉRIOS DE COBRANÇA E DESLOCAMENTO -->
        <div style="background: #F8FAFC; border: 1px solid #CBD5E1; padding: 12px; border-radius: 6px; margin-bottom: 15px;">
          <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--deep-navy);">Critérios de Cobrança e Deslocamento</h3>
          
          <!-- Regime de Empreitada -->
          <div style="margin-bottom: 12px;">
            <label for="selectEmpreitada"><strong>Regime de Empreitada (Valor Fechado)?</strong></label>
            <select id="selectEmpreitada" class="form-control" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF; margin-top: 4px;" onchange="toggleEmpreitadaSelect()">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div id="boxEmpreitadaDetalhes" style="display: none; margin-bottom: 12px; background: #FFF; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <label for="repValorEmpreitada">Valor Total da Empreitada (R$):</label>
            <input type="number" step="0.01" id="repValorEmpreitada" value="0.00" placeholder="Ex: 1500.00" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
          </div>

          <!-- Cobrar Hora Trabalhada -->
          <div style="margin-bottom: 12px;">
            <label for="selectHora"><strong>Cobrar Hora Trabalhada?</strong></label>
            <select id="selectHora" class="form-control" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF; margin-top: 4px;" onchange="toggleHoraSelect()">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div id="boxHoraDetalhes" style="display: none; margin-bottom: 12px; background: #FFF; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <div style="margin-bottom: 8px;">
              <label>Início / Fim Manhã:</label>
              <div style="display: flex; gap: 5px; margin-top: 2px;">
                <input type="time" id="startManha" style="width:50%; padding:6px; border:1px solid #CBD5E1; border-radius:4px;">
                <input type="time" id="endManha" style="width:50%; padding:6px; border:1px solid #CBD5E1; border-radius:4px;">
              </div>
            </div>
            <div style="margin-bottom: 8px;">
              <label>Início / Fim Tarde:</label>
              <div style="display: flex; gap: 5px; margin-top: 2px;">
                <input type="time" id="startTarde" style="width:50%; padding:6px; border:1px solid #CBD5E1; border-radius:4px;">
                <input type="time" id="endTarde" style="width:50%; padding:6px; border:1px solid #CBD5E1; border-radius:4px;">
              </div>
            </div>
            <div>
              <label for="repValorHora">Valor da Hora (R$):</label>
              <input type="number" step="0.01" id="repValorHora" value="200.00" placeholder="Ex: 200.00" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
            </div>
          </div>

          <!-- Cobrar Km Rodado -->
          <div style="margin-bottom: 12px;">
            <label for="selectKm"><strong>Cobrar Km Rodado?</strong></label>
            <select id="selectKm" class="form-control" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF; margin-top: 4px;" onchange="toggleKmSelect()">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div id="boxKmDetalhes" style="display: none; margin-bottom: 12px; background: #FFF; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <div style="margin-bottom: 8px;">
              <label for="valorKm">Valor por Km (R$):</label>
              <input type="number" step="0.01" id="valorKm" value="2.50" placeholder="Ex: 2.50" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
            </div>
            <div style="margin-bottom: 8px;">
              <label for="kmIda">Km Ida:</label>
              <input type="number" id="kmIda" value="0" placeholder="Ex: 50" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
            </div>
            <div>
              <label for="kmVolta">Km Volta:</label>
              <input type="number" id="kmVolta" value="0" placeholder="Ex: 50" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
            </div>
          </div>

          <!-- Adicionar Combustível -->
          <div style="margin-bottom: 12px;">
            <label for="selectCombustivel"><strong>Adicionar Combustível?</strong></label>
            <select id="selectCombustivel" class="form-control" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF; margin-top: 4px;" onchange="toggleCombustivelSelect()">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div id="boxCombustivelDetalhes" style="display: none; margin-bottom: 12px; background: #FFF; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <div style="margin-bottom: 8px;">
              <label for="valorLitro">Valor por Litro (R$):</label>
              <input type="number" step="0.01" id="valorLitro" value="6.00" placeholder="Ex: 6.00" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
            </div>
            <div>
              <label for="combustivelLitros">Quantidade (Litros):</label>
              <input type="number" step="0.1" id="combustivelLitros" value="0" placeholder="Ex: 15.5" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
            </div>
          </div>

          <!-- Adicionar Pedágio (Sim/Não) -->
          <div style="margin-bottom: 12px;">
            <label for="selectPedagio"><strong>Adicionar Pedágio?</strong></label>
            <select id="selectPedagio" class="form-control" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF; margin-top: 4px;" onchange="togglePedagioSelect()">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div id="boxPedagioDetalhes" style="display: none; margin-bottom: 12px; background: #FFF; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <label for="valorPedagio">Valor do Pedágio (R$):</label>
            <input type="number" step="0.01" id="valorPedagio" value="0.00" placeholder="Ex: 30.00" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
          </div>

          <!-- Adicionar Hospedagem (Sim/Não) -->
          <div style="margin-bottom: 12px;">
            <label for="selectHospedagem"><strong>Adicionar Hospedagem?</strong></label>
            <select id="selectHospedagem" class="form-control" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF; margin-top: 4px;" onchange="toggleHospedagemSelect()">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div id="boxHospedagemDetalhes" style="display: none; margin-bottom: 12px; background: #FFF; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <label for="valorHospedagem">Valor da Hospedagem (R$):</label>
            <input type="number" step="0.01" id="valorHospedagem" value="0.00" placeholder="Ex: 150.00" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
          </div>

          <!-- Adicionar Outras Despesas / Alimentação (Sim/Não) -->
          <div style="margin-bottom: 4px;">
            <label for="selectOutras"><strong>Adicionar Outras Despesas / Alimentação?</strong></label>
            <select id="selectOutras" class="form-control" style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:4px; background:#FFF; margin-top: 4px;" onchange="toggleOutrasSelect()">
              <option value="nao">Não</option>
              <option value="sim">Sim</option>
            </select>
          </div>

          <div id="boxOutrasDetalhes" style="display: none; margin-top: 10px; background: #FFF; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <label for="valorOutras">Valor Adicional (R$):</label>
            <input type="number" step="0.01" id="valorOutras" value="0.00" placeholder="Ex: 50.00" style="width:100%; padding:6px; border:1px solid #CBD5E1; border-radius:4px; margin-top: 2px;">
          </div>
        </div>

        <!-- ANEXOS DE FOTOS (ACIMA DA ASSINATURA) -->
        <div style="margin-bottom: 20px;">
          <h3>📸 Fotografias / Anexos do Equipamento</h3>
          <div style="margin-bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap;">
            <input type="text" id="anexoTitulo" placeholder="Título da foto (Ex: Placa de identificação)" style="flex: 2; padding: 8px; border: 1px solid #CBD5E1; border-radius: 4px;">
            <input type="file" id="anexoFile" accept="image/*" style="flex: 2; padding: 6px; border: 1px solid #CBD5E1; border-radius: 4px; background: #FFF;" onchange="converterAnexo(event)">
            <button type="button" class="btn" style="background-color: #1D4ED8; color: #FFF; padding: 8px 15px;" onclick="adicionarAnexo()">Adicionar Foto</button>
          </div>
          <div id="listaAnexos" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <!-- ASSINATURA DO CLIENTE APENAS -->
        <div style="margin-bottom: 15px;">
          <label><strong>Assinatura do Cliente:</strong></label>
          <canvas id="clientCanvas" class="signature-pad" width="400" height="150"></canvas>
          <button type="button" class="btn" style="background-color: #64748B; color: #FFF; padding: 4px 10px; font-size: 0.8rem;" onclick="clearClientSig()">Limpar Assinatura do Cliente</button>
        </div>

        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn" style="background-color: #00F5D4; color: #0B132B; font-weight: bold; padding: 10px 20px;">Salvar Relatório de Serviço</button>
          <button type="button" class="btn" style="background-color: #64748B; color: #FFF; padding: 10px 20px;" onclick="resetForm()">Cancelar / Limpar</button>
        </div>
      </form>
    </section>
  </main>

  <footer class="no-print">
    <p>&copy; 2026 Laser Expert — Todos os direitos reservados. | Powered by <strong>CS Code Solutions</strong></p>
  </footer>

  <script>
    let anexosList = [];
    let clientMachines = [];
    let clientCanvas = document.getElementById('clientCanvas');
    let clientCtx = clientCanvas.getContext('2d');
    let paintingClient = false;
    let tempAnexoBase64 = '';

    function startClient(e) { paintingClient = true; drawClient(e); }
    function finishClient() { paintingClient = false; clientCtx.beginPath(); }
    function drawClient(e) {
      if (!paintingClient) return;
      clientCtx.lineWidth = 2;
      clientCtx.lineCap = 'round';
      clientCtx.strokeStyle = '#0B132B';
      const rect = clientCanvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;
      clientCtx.lineTo(x, y);
      clientCtx.stroke();
      clientCtx.beginPath();
      clientCtx.moveTo(x, y);
    }

    clientCanvas.addEventListener('mousedown', startClient);
    clientCanvas.addEventListener('mouseup', finishClient);
    clientCanvas.addEventListener('mousemove', drawClient);
    clientCanvas.addEventListener('touchstart', startClient);
    clientCanvas.addEventListener('touchend', finishClient);
    clientCanvas.addEventListener('touchmove', drawClient);

    window.clearClientSig = function() {
      clientCtx.clearRect(0, 0, clientCanvas.width, clientCanvas.height);
    };

    function toggleEmpreitadaSelect() {
      const val = document.getElementById('selectEmpreitada').value;
      document.getElementById('boxEmpreitadaDetalhes').style.display = (val === 'sim') ? 'block' : 'none';
    }
    function toggleHoraSelect() {
      const val = document.getElementById('selectHora').value;
      document.getElementById('boxHoraDetalhes').style.display = (val === 'sim') ? 'block' : 'none';
    }
    function toggleKmSelect() {
      const val = document.getElementById('selectKm').value;
      document.getElementById('boxKmDetalhes').style.display = (val === 'sim') ? 'block' : 'none';
    }
    function toggleCombustivelSelect() {
      const val = document.getElementById('selectCombustivel').value;
      document.getElementById('boxCombustivelDetalhes').style.display = (val === 'sim') ? 'block' : 'none';
    }
    function togglePedagioSelect() {
      const val = document.getElementById('selectPedagio').value;
      document.getElementById('boxPedagioDetalhes').style.display = (val === 'sim') ? 'block' : 'none';
    }
    function toggleHospedagemSelect() {
      const val = document.getElementById('selectHospedagem').value;
      document.getElementById('boxHospedagemDetalhes').style.display = (val === 'sim') ? 'block' : 'none';
    }
    function toggleOutrasSelect() {
      const val = document.getElementById('selectOutras').value;
      document.getElementById('boxOutrasDetalhes').style.display = (val === 'sim') ? 'block' : 'none';
    }

    function converterAnexo(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        tempAnexoBase64 = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    window.adicionarAnexo = function() {
      const titulo = document.getElementById('anexoTitulo').value;
      if (!tempAnexoBase64) { alert('Selecione uma imagem primeiro.'); return; }
      anexosList.push({ titulo: titulo || 'Foto do Equipamento', imagem: tempAnexoBase64 });
      document.getElementById('anexoTitulo').value = '';
      document.getElementById('anexoFile').value = '';
      tempAnexoBase64 = '';
      renderizarAnexos();
    };

    window.removerAnexo = function(index) {
      anexosList.splice(index, 1);
      renderizarAnexos();
    };

    function renderizarAnexos() {
      const container = document.getElementById('listaAnexos');
      container.innerHTML = '';
      anexosList.forEach((a, idx) => {
        container.innerHTML += `
          <div style="display: flex; justify-content: space-between; align-items: center; background: #F8FAFC; border: 1px solid #CBD5E1; padding: 6px 10px; border-radius: 4px;">
            <span><strong>${idx + 1}.</strong> ${a.titulo}</span>
            <button type="button" class="btn" style="background-color: #EF4444; padding: 2px 6px; font-size: 0.75rem;" onclick="removerAnexo(${idx})">Remover</button>
          </div>
        `;
      });
    }

    async function loadClients() {
      const select = document.getElementById('repClient');
      if (!select) return;
      try {
        const clients = await DataSync.load('rg_clients') || [];
        select.innerHTML = '<option value="">Selecione um cliente...</option>';
        clients.forEach(c => { select.innerHTML += `<option value="${c.name}">${c.name}</option>`; });
      } catch (e) { console.error("Erro ao carregar clientes", e); }
    }

    async function carregarMaquinasDoCliente(clientName, selectedEquipment = '') {
      const eqSelect = document.getElementById('repEquipment');
      eqSelect.innerHTML = '<option value="">Selecione a máquina...</option>';
      clientMachines = [];

      if (!clientName) return;
      try {
        const machines = await DataSync.load('rg_machines') || [];
        clientMachines = machines.filter(m => m.client === clientName || m.cliente === clientName);
        
        clientMachines.forEach((m, idx) => {
          const eqName = m.equipment || m.nome || m.name || `Máquina ${idx+1}`;
          const isSelected = (eqName === selectedEquipment) ? 'selected' : '';
          eqSelect.innerHTML += `<option value="${eqName}" data-index="${idx}" ${isSelected}>${eqName}</option>`;
        });
      } catch (e) {
        console.error("Erro ao carregar máquinas do cliente", e);
      }
    }

    document.getElementById('repClient').addEventListener('change', async function() {
      const clientName = this.value;
      document.getElementById('repBrand').value = '';
      document.getElementById('repModel').value = '';
      document.getElementById('repSerialNumber').value = '';
      await carregarMaquinasDoCliente(clientName);
    });

    document.getElementById('repEquipment').addEventListener('change', function() {
      const selectedOption = this.options[this.selectedIndex];
      const idx = selectedOption.getAttribute('data-index');
      if (idx !== null && clientMachines[idx]) {
        const m = clientMachines[idx];
        document.getElementById('repBrand').value = m.brand || m.marca || '';
        document.getElementById('repModel').value = m.model || m.modelo || '';
        document.getElementById('repSerialNumber').value = m.serialNumber || m.serie || m.matricula || '';
      } else {
        document.getElementById('repBrand').value = '';
        document.getElementById('repModel').value = '';
        document.getElementById('repSerialNumber').value = '';
      }
    });

    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById('repDate').valueAsDate = new Date();
      await loadClients();

      const urlParams = new URLSearchParams(window.location.search);
      const editIndex = urlParams.get('edit');
      if (editIndex !== null) {
        try {
          let reports = await DataSync.load('rg_reports') || [];
          const rep = reports[editIndex];
          if (rep) {
            document.getElementById('editIndex').value = editIndex;
            document.getElementById('formTitle').textContent = `Editar Relatório - ${rep.number}`;
            document.getElementById('repNumber').value = rep.number || '';
            document.getElementById('repDate').value = rep.date || '';
            document.getElementById('repClient').value = rep.client || '';
            
            await carregarMaquinasDoCliente(rep.client, rep.equipment);

            document.getElementById('repBrand').value = rep.brand || '';
            document.getElementById('repModel').value = rep.model || '';
            document.getElementById('repSerialNumber').value = rep.serialNumber || '';
            document.getElementById('repServiceNature').value = rep.serviceNature || 'Corretiva';
            document.getElementById('repServiceArea').value = rep.serviceArea || 'Mecânica';
            document.getElementById('repDesc').value = rep.desc || '';
            
            if (rep.temEmpreitada === 'sim') {
              document.getElementById('selectEmpreitada').value = 'sim';
              toggleEmpreitadaSelect();
              document.getElementById('repValorEmpreitada').value = rep.valorEmpreitada || 0;
            } else {
              document.getElementById('selectEmpreitada').value = 'nao';
              toggleEmpreitadaSelect();
            }

            if (rep.temHora === 'sim') {
              document.getElementById('selectHora').value = 'sim';
              toggleHoraSelect();
              document.getElementById('startManha').value = rep.startManha || '';
              document.getElementById('endManha').value = rep.endManha || '';
              document.getElementById('startTarde').value = rep.startTarde || '';
              document.getElementById('endTarde').value = rep.endTarde || '';
              document.getElementById('repValorHora').value = rep.valorHora || 200.00;
            } else {
              document.getElementById('selectHora').value = 'nao';
              toggleHoraSelect();
            }

            if (rep.temKm === 'sim') {
              document.getElementById('selectKm').value = 'sim';
              toggleKmSelect();
              document.getElementById('kmIda').value = rep.kmIda || 0;
              document.getElementById('kmVolta').value = rep.kmVolta || 0;
              document.getElementById('valorKm').value = rep.valorKm || 2.50;
            } else {
              document.getElementById('selectKm').value = 'nao';
              toggleKmSelect();
            }

            if (rep.temCombustivel === 'sim') {
              document.getElementById('selectCombustivel').value = 'sim';
              toggleCombustivelSelect();
              document.getElementById('combustivelLitros').value = rep.combustivelLitros || 0;
              document.getElementById('valorLitro').value = rep.valorLitro || 6.00;
            } else {
              document.getElementById('selectCombustivel').value = 'nao';
              toggleCombustivelSelect();
            }

            if (rep.temPedagio === 'sim') {
              document.getElementById('selectPedagio').value = 'sim';
              togglePedagioSelect();
              document.getElementById('valorPedagio').value = rep.valorPedagio || 0;
            } else {
              document.getElementById('selectPedagio').value = 'nao';
              togglePedagioSelect();
            }

            if (rep.temHospedagem === 'sim') {
              document.getElementById('selectHospedagem').value = 'sim';
              toggleHospedagemSelect();
              document.getElementById('valorHospedagem').value = rep.valorHospedagem || 0;
            } else {
              document.getElementById('selectHospedagem').value = 'nao';
              toggleHospedagemSelect();
            }

            if (rep.temOutras === 'sim') {
              document.getElementById('selectOutras').value = 'sim';
              toggleOutrasSelect();
              document.getElementById('valorOutras').value = rep.valorOutras || 0;
            } else {
              document.getElementById('selectOutras').value = 'nao';
              toggleOutrasSelect();
            }

            if (rep.signature) {
              const img = new Image();
              img.onload = () => { clientCtx.drawImage(img, 0, 0); };
              img.src = rep.signature;
            }
            if (rep.anexos && Array.isArray(rep.anexos)) {
              anexosList = rep.anexos;
              renderizarAnexos();
            }
          }
        } catch (e) {
          console.error("Erro ao carregar relatório para edição", e);
        }
      } else {
        // Geração robusta do próximo número de RS
        try {
          let reports = await DataSync.load('rg_reports') || [];
          let config = await DataSync.load('rg_config') || {};
          let nextNum = 1000;
          if (config.nextRsNumber) {
            nextNum = Number(config.nextRsNumber);
          } else if (reports.length > 0) {
            let maxNum = 999;
            reports.forEach(r => {
              if (r.number) {
                const match = r.number.match(/\d+/);
                if (match) {
                  const num = parseInt(match[0], 10);
                  if (num > maxNum) maxNum = num;
                }
              }
            });
            nextNum = maxNum + 1;
          }
          document.getElementById('repNumber').value = `RS-${nextNum}`;
        } catch (e) {
          document.getElementById('repNumber').value = 'RS-1000';
        }
      }
    });

    document.getElementById('reportForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editIndex = document.getElementById('editIndex').value;

      const clientSigData = clientCanvas.toDataURL();
      const numRsStr = document.getElementById('repNumber').value;

      const reportData = {
        number: numRsStr,
        date: document.getElementById('repDate').value,
        client: document.getElementById('repClient').value,
        equipment: document.getElementById('repEquipment').value,
        brand: document.getElementById('repBrand').value,
        model: document.getElementById('repModel').value,
        serialNumber: document.getElementById('repSerialNumber').value,
        serviceNature: document.getElementById('repServiceNature').value,
        serviceArea: document.getElementById('repServiceArea').value,
        desc: document.getElementById('repDesc').value,
        
        temEmpreitada: document.getElementById('selectEmpreitada').value,
        valorEmpreitada: document.getElementById('repValorEmpreitada').value,

        temHora: document.getElementById('selectHora').value,
        startManha: document.getElementById('startManha').value,
        endManha: document.getElementById('endManha').value,
        startTarde: document.getElementById('startTarde').value,
        endTarde: document.getElementById('endTarde').value,
        valorHora: document.getElementById('repValorHora').value,

        temKm: document.getElementById('selectKm').value,
        kmIda: document.getElementById('kmIda').value,
        kmVolta: document.getElementById('kmVolta').value,
        valorKm: document.getElementById('valorKm').value,

        temCombustivel: document.getElementById('selectCombustivel').value,
        combustivelLitros: document.getElementById('combustivelLitros').value,
        valorLitro: document.getElementById('valorLitro').value,

        temPedagio: document.getElementById('selectPedagio').value,
        valorPedagio: document.getElementById('valorPedagio').value,

        temHospedagem: document.getElementById('selectHospedagem').value,
        valorHospedagem: document.getElementById('valorHospedagem').value,

        temOutras: document.getElementById('selectOutras').value,
        valorOutras: document.getElementById('valorOutras').value,

        signature: clientSigData,
        anexos: anexosList
      };

      try {
        let reports = await DataSync.load('rg_reports') || [];
        if (!Array.isArray(reports)) reports = [];

        if (editIndex !== '') {
          reports[editIndex] = reportData;
        } else {
          reports.push(reportData);
          let config = await DataSync.load('rg_config') || {};
          const matchNum = numRsStr.match(/\d+/);
          const currentNum = matchNum ? parseInt(matchNum[0], 10) : (1000 + reports.length);
          config.nextRsNumber = String(currentNum + 1);
          await DataSync.save('rg_config', config);
        }

        await DataSync.save('rg_reports', reports);
        alert('Relatório de serviço salvo e sincronizado com sucesso!');
        window.location.href = 'historico.html';
      } catch (err) {
        alert('Erro ao salvar relatório: ' + err.message);
      }
    });

    window.resetForm = function() {
      document.getElementById('reportForm').reset();
      document.getElementById('editIndex').value = '';
      document.getElementById('formTitle').textContent = 'Novo Relatório de Serviço (RS)';
      document.getElementById('repDate').valueAsDate = new Date();
      document.getElementById('repEquipment').innerHTML = '<option value="">Selecione primeiro um cliente...</option>';
      toggleEmpreitadaSelect();
      toggleHoraSelect();
      toggleKmSelect();
      toggleCombustivelSelect();
      togglePedagioSelect();
      toggleHospedagemSelect();
      toggleOutrasSelect();
      clientCtx.clearRect(0, 0, clientCanvas.width, clientCanvas.height);
      anexosList = [];
      renderizarAnexos();
    };
  </script>
</body>
</html>
